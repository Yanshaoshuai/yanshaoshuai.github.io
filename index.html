<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>我的文档</title>
  <meta name="description" content="个人文档中心">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Docsify 主题 -->
  <link rel="stylesheet" href="static/css/vue.css">
  <!-- 侧边栏文件夹样式 -->
  <link rel="stylesheet" href="static/css/sidebar-folder.min.css">
</head>
<body>
  <div id="app">加载中...</div>
  <script>
    window.$docsify = {
      name: '📚 我的文档',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      homepage: 'README.md',
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '🔍 搜索文档...',
        noData: '找不到相关结果',
        depth: 6,
        hideOtherSidebarContent: false
      },
      plugins: [
        function(hook, vm) {
          hook.doneEach(function() {
            // 使用 Prism 高亮代码块
            if (typeof Prism !== 'undefined') {
              Prism.highlightAll();
            }
          });
        }
      ]
    };
  </script>
  
  <!-- Docsify 核心 -->
  <script src="static/js/docsify.min.js"></script>
  <!-- 侧边栏折叠插件 -->
  <script src="static/js/docsify-sidebar-collapse.min.js"></script>
  <!-- 搜索插件 -->
  <script src="static/plugins/search.min.js"></script>
  <!-- 图片缩放插件 -->
  <script src="static/plugins/zoom-image.min.js"></script>
  
  <!-- PrismJS 代码高亮 -->
  <script src="static/prismjs/prism.min.js"></script>
  <script src="static/prismjs/prism-bash.min.js"></script>
  <script src="static/prismjs/prism-javascript.min.js"></script>
  <script src="static/prismjs/prism-python.min.js"></script>
  <script src="static/prismjs/prism-java.min.js"></script>
  <script src="static/prismjs/prism-json.min.js"></script>
</body>
</html>
